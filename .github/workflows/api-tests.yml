name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite rodar manualmente pela aba "Actions" (botão "Run workflow")
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Instalar dependências (ServeRest + Newman)
        run: npm ci

      # A API roda dentro do próprio job: os testes não dependem
      # da disponibilidade da instância pública serverest.dev
      - name: Subir a ServeRest local
        run: |
          npx serverest --nodoc > serverest.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/usuarios > /dev/null && echo "ServeRest no ar" && exit 0
            sleep 1
          done
          echo "ServeRest não subiu" && cat serverest.log && exit 1

      - name: Testes RestAssured + JUnit 5
        run: mvn -B test

      - name: Testes Postman (Newman)
        if: always()
        run: npm run test:postman

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports/
            newman/
          retention-days: 30
